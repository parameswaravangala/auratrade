# Local development stack. Integration tests use Testcontainers and do not need this.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: auratrade
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aura_dev}
    ports:
      # Loopback only: never publish the database on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d auratrade"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local LLM for dev: docker compose --profile local-llm up -d
  ollama:
    # Latest GA release, checked 2026-11-27 on github.com/ollama/ollama/releases. Bump on purpose.
    image: ollama/ollama:0.40.18
    profiles: ["local-llm"]
    ports:
      # Loopback only: Ollama has no authentication.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata: {}
  ollama: {}
