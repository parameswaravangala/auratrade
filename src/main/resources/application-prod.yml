# Production (paper environment on the VPS). Everything comes from the environment; no defaults.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      console: ecs # structured JSON logs

auratrade:
  marketdata:
    candles:
      # No default on purpose: production must choose (upstox for now). Startup fails if unset.
      provider: ${CANDLE_PROVIDER}
