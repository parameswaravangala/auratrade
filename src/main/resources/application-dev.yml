# Local development (SPRING_PROFILES_ACTIVE=dev). Reads the git-ignored .env file in the working
# directory as properties, so secrets such as UPSTOX_ANALYTICS_TOKEN reach the app without being
# exported in the shell. Production reads real environment variables instead.
spring:
  config:
    import: optional:file:.env[.properties]

# Loopback only: the dev and paper endpoints have no authentication, so never listen on the LAN.
server:
  address: 127.0.0.1

auratrade:
  jobs:
    enabled: true
    eod-candles:
      # All shares: paper trading needs the full universe (0 = no limit).
      max-instruments: 0
