spring:
  application:
    name: auratrade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auratrade}
    username: ${DB_USER:aura}
    password: ${DB_PASSWORD:aura_dev}
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error responses

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

auratrade:
  security:
    # Host and Origin guard (platform.web.LocalRequestGuard). Until there is authentication the app
    # only serves this machine: Host must be loopback, and a browser Origin must be listed here.
    # On in every profile, prod included: fail closed until authentication exists (B-031, README).
    # 5173 is the Vite UI, 5174 a second UI (for example another worktree), 8080 the backend.
    local-guard:
      enabled: true
      allowed-origins: >-
        http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080
  llm:
    monthly-budget-usd: 50
    # Local-first: every tier runs on one Ollama model. HEAVY and LIGHT carry pretend Claude prices
    # so budget and fallback logic behave as they will in production. LOCAL is free.
    tiers:
      HEAVY:
        model: ${OLLAMA_MODEL:llama3.2:3b}
        price:
          inputPerMTok: 2.00
          outputPerMTok: 10.00
          cacheReadPerMTok: 0.10
          cacheWritePerMTok: 2.50
      LIGHT:
        model: ${OLLAMA_MODEL:llama3.2:3b}
        price:
          inputPerMTok: 0.10
          outputPerMTok: 0.50
      LOCAL:
        model: ${OLLAMA_MODEL:llama3.2:3b}
        price:
          inputPerMTok: 0
          outputPerMTok: 0
    # No agent floors at LOCAL by default: a small VPS cannot host a useful model.
    # Opt in per agent (floor: LOCAL) only where an Ollama endpoint is reachable.
    agents:
      NEWS_TRIAGE:
        { preferred: LIGHT, floor: LIGHT, critical: false, dailyTokenCap: 1000000 }
      STOCK_ANALYSIS:
        { preferred: HEAVY, floor: LIGHT, critical: false, dailyTokenCap: 600000 }
      RISK_REVIEW:
        { preferred: HEAVY, floor: HEAVY, critical: true, dailyTokenCap: 200000 }
      DAILY_REPORT:
        { preferred: LIGHT, floor: LIGHT, critical: false, dailyTokenCap: 100000 }
      ADHOC_CHAT:
        { preferred: HEAVY, floor: LIGHT, critical: false, dailyTokenCap: 300000 }
  marketdata:
    candles:
      # Which provider consumers read candles from (ADR 0016). Development uses Upstox;
      # production sets it explicitly (see application-prod.yml).
      provider: upstox
  jobs:
    # Schedules and startup catch-up (ADR 0017). Off by default so tests and tools never start
    # jobs; the dev and prod profiles turn them on.
    enabled: false
