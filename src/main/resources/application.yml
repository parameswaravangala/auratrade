spring:
  application:
    name: auratrade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auratrade}
    username: ${DB_USER:aura}
    password: ${DB_PASSWORD:aura_dev}
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error responses

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
